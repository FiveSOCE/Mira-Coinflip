name: Build and Publish Dev JAR
on:
  push:
    branches:
      - 'compat/1.18'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile plugin
        run: gradle clean build --no-daemon
      - name: Check JAR contents
        run: |
          test -s build/libs/Mira-Coinflip-1.18-0.1.0-dev.jar
          jar tf build/libs/Mira-Coinflip-1.18-0.1.0-dev.jar | grep -Fx 'plugin.yml'
          jar tf build/libs/Mira-Coinflip-1.18-0.1.0-dev.jar | grep -Fx 'com/fivesoce/mira/coinflip/MiraCoinflip.class'
      - uses: actions/upload-artifact@v4
        with:
          name: Mira-Coinflip-1.18
          path: build/libs/Mira-Coinflip-1.18-0.1.0-dev.jar
          if-no-files-found: error
      - name: Publish development JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view 'dev-1.18' >/dev/null 2>&1 || gh release create 'dev-1.18' --prerelease --title 'Mira-Coinflip 1.18 development' --notes 'Development preview only; wagering is disabled pending escrow implementation.' --target "$GITHUB_SHA"
          gh release upload 'dev-1.18' build/libs/Mira-Coinflip-1.18-0.1.0-dev.jar --clobber
